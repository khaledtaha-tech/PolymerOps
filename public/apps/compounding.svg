<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091b29"/>
      <stop offset="50%" stop-color="#0f2b38"/>
      <stop offset="100%" stop-color="#06141e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#cpBg)"/>
  
  <!-- Mixer Tank Schematic -->
  <g transform="translate(420, 70)">
    <rect width="280" height="260" rx="16" fill="#0f172a" stroke="#0ea5e9" stroke-width="2"/>
    <ellipse cx="140" cy="40" rx="90" ry="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <line x1="140" y1="40" x2="140" y2="200" stroke="#f59e0b" stroke-width="6"/>
    <!-- Impeller blades -->
    <path d="M 90 200 Q 140 220, 190 200 Q 140 180, 90 200 Z" fill="#f59e0b"/>
    <text x="140" y="245" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">TURBO MIXER 120°C</text>
  </g>

  <!-- Recipe Formulation Breakdown -->
  <g transform="translate(60, 70)">
    <rect width="320" height="260" rx="16" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="24" y="36" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">FORMULATION BATCH</text>
    
    <text x="24" y="75" fill="#94a3b8" font-family="sans-serif" font-size="12">PVC Resin (K-67)</text>
    <rect x="24" y="85" width="270" height="8" rx="4" fill="#1e293b"/>
    <rect x="24" y="85" width="220" height="8" rx="4" fill="#38bdf8"/>

    <text x="24" y="125" fill="#94a3b8" font-family="sans-serif" font-size="12">CaCO3 (Coated Filler)</text>
    <rect x="24" y="135" width="270" height="8" rx="4" fill="#1e293b"/>
    <rect x="24" y="135" width="90" height="8" rx="4" fill="#f59e0b"/>

    <text x="24" y="175" fill="#94a3b8" font-family="sans-serif" font-size="12">One-Pack Ca/Zn Stabilizer</text>
    <rect x="24" y="185" width="270" height="8" rx="4" fill="#1e293b"/>
    <rect x="24" y="185" width="45" height="8" rx="4" fill="#10b981"/>

    <text x="24" y="230" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">BATCH CONSISTENCY: 99.8%</text>
  </g>

  <text x="40" y="380" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">COMPOUNDING PROCESS CONTROL</text>
  <text x="40" y="405" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">FORMULATION & THERMAL MIXING INTEGRITY</text>
</svg>