<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pwpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pwpBg)"/>

  <!-- Shift Matrix Card -->
  <g transform="translate(60, 60)">
    <rect width="680" height="280" rx="14" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
    
    <text x="30" y="40" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">24/7 PRODUCTION SHIFT SCHEDULE</text>
    
    <!-- Shift Rows -->
    <g transform="translate(30, 70)">
      <!-- Shift A -->
      <rect x="0" y="0" width="180" height="50" rx="6" fill="#0f172a"/>
      <text x="15" y="30" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">SHIFT A (Morning)</text>
      <rect x="200" y="0" width="420" height="50" rx="6" fill="#0284c7" opacity="0.6"/>
      <text x="220" y="30" fill="#ffffff" font-family="sans-serif" font-size="12">14 Line Operators · Active On Duty</text>

      <!-- Shift B -->
      <rect x="0" y="65" width="180" height="50" rx="6" fill="#0f172a"/>
      <text x="15" y="95" fill="#f59e0b" font-family="sans-serif" font-size="14" font-weight="bold">SHIFT B (Evening)</text>
      <rect x="200" y="65" width="420" height="50" rx="6" fill="#f59e0b" opacity="0.5"/>
      <text x="220" y="95" fill="#ffffff" font-family="sans-serif" font-size="12">14 Line Operators · Scheduled 15:00</text>

      <!-- Shift C -->
      <rect x="0" y="130" width="180" height="50" rx="6" fill="#0f172a"/>
      <text x="15" y="160" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold">SHIFT C (Night)</text>
      <rect x="200" y="130" width="420" height="50" rx="6" fill="#a855f7" opacity="0.5"/>
      <text x="220" y="160" fill="#ffffff" font-family="sans-serif" font-size="12">12 Line Operators · Scheduled 23:00</text>
    </g>
  </g>

  <text x="40" y="380" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">PWP MANPOWER PLANNER</text>
  <text x="40" y="405" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">CONTINUOUS FACTORY WORKFORCE & CREW MATRIX</text>
</svg>