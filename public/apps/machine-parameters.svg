<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1926"/>
      <stop offset="100%" stop-color="#05101a"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#mBg)"/>

  <!-- Temperature Zones -->
  <g transform="translate(60, 70)">
    <rect width="680" height="150" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
    <text x="24" y="35" fill="#38bdf8" font-family="sans-serif" font-size="13" font-weight="bold">EXTRUDER BARREL TEMPERATURE ZONES (°C)</text>
    
    <!-- Zone 1 to 5 -->
    <g transform="translate(24, 55)">
      <rect x="0" y="0" width="110" height="65" rx="8" fill="#1e293b"/>
      <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="10">ZONE 1</text>
      <text x="15" y="50" fill="#f59e0b" font-family="sans-serif" font-size="20" font-weight="bold">165°C</text>

      <rect x="130" y="0" width="110" height="65" rx="8" fill="#1e293b"/>
      <text x="145" y="25" fill="#94a3b8" font-family="sans-serif" font-size="10">ZONE 2</text>
      <text x="145" y="50" fill="#f59e0b" font-family="sans-serif" font-size="20" font-weight="bold">175°C</text>

      <rect x="260" y="0" width="110" height="65" rx="8" fill="#1e293b"/>
      <text x="275" y="25" fill="#94a3b8" font-family="sans-serif" font-size="10">ZONE 3</text>
      <text x="275" y="50" fill="#f59e0b" font-family="sans-serif" font-size="20" font-weight="bold">182°C</text>

      <rect x="390" y="0" width="110" height="65" rx="8" fill="#1e293b"/>
      <text x="405" y="25" fill="#94a3b8" font-family="sans-serif" font-size="10">ZONE 4</text>
      <text x="405" y="50" fill="#f59e0b" font-family="sans-serif" font-size="20" font-weight="bold">188°C</text>

      <rect x="520" y="0" width="110" height="65" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="535" y="25" fill="#38bdf8" font-family="sans-serif" font-size="10">DIE HEAD</text>
      <text x="535" y="50" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">195°C</text>
    </g>
  </g>

  <!-- Gauges: Screw RPM & Melt Pressure -->
  <g transform="translate(60, 245)">
    <rect width="325" height="95" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">SCREW SPEED</text>
    <text x="20" y="65" fill="#38bdf8" font-family="sans-serif" font-size="30" font-weight="900">28.4 RPM</text>
  </g>

  <g transform="translate(415, 245)">
    <rect width="325" height="95" rx="10" fill="#0f172a" stroke="#334155"/>
    <text x="20" y="30" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">MELT PRESSURE</text>
    <text x="20" y="65" fill="#10b981" font-family="sans-serif" font-size="30" font-weight="900">225 bar</text>
  </g>

  <text x="40" y="380" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">MACHINE PARAMETERS & TRIALS</text>
  <text x="40" y="405" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">EXTRUSION CONDITIONS PRESET DATABASE</text>
</svg>