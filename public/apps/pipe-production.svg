<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="prodBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081726"/>
      <stop offset="50%" stop-color="#0c2b44"/>
      <stop offset="100%" stop-color="#061320"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#prodBg)"/>

  <!-- Live Chart Container -->
  <rect x="60" y="60" width="680" height="260" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Chart Grid Lines -->
  <line x1="80" y1="120" x2="720" y2="120" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="180" x2="720" y2="180" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="240" x2="720" y2="240" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>
  
  <!-- Line Area Graph -->
  <path d="M 100 240 Q 180 180, 240 200 T 380 140 T 520 160 T 640 100 T 700 90" fill="none" stroke="url(#chartLine)" stroke-width="4"/>
  <circle cx="700" cy="90" r="7" fill="#10b981"/>
  <circle cx="700" cy="90" r="14" fill="#10b981" opacity="0.3"/>

  <!-- Metric Badges Inside Chart -->
  <g transform="translate(90, 80)">
    <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">PRODUCTION OUTPUT</text>
    <text x="0" y="26" fill="#ffffff" font-family="sans-serif" font-size="24" font-weight="900">465 kg/h</text>
  </g>

  <g transform="translate(300, 80)">
    <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">OVERALL OEE</text>
    <text x="0" y="26" fill="#10b981" font-family="sans-serif" font-size="24" font-weight="900">92.4%</text>
  </g>

  <g transform="translate(500, 80)">
    <text x="0" y="0" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">SCRAP RATE</text>
    <text x="0" y="26" fill="#38bdf8" font-family="sans-serif" font-size="24" font-weight="900">1.18%</text>
  </g>

  <!-- Title Bottom -->
  <text x="40" y="380" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">PVC PIPE PRODUCTION SUITE</text>
  <text x="40" y="405" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">REAL-TIME MANUFACTURING EXECUTION & OEE</text>
</svg>