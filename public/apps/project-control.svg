<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ppcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#ppcBg)"/>

  <!-- Project Milestones Timeline -->
  <g transform="translate(60, 60)">
    <rect width="680" height="280" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="30" y="40" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold">LINE EXPANSION & COMMISSIONING GANTT</text>

    <g transform="translate(30, 80)">
      <text x="0" y="20" fill="#94a3b8" font-family="sans-serif" font-size="12">1. Foundation Civil Works</text>
      <rect x="220" y="6" width="120" height="20" rx="4" fill="#10b981"/>

      <text x="0" y="65" fill="#94a3b8" font-family="sans-serif" font-size="12">2. Extruder Delivery & Placement</text>
      <rect x="320" y="51" width="100" height="20" rx="4" fill="#10b981"/>

      <text x="0" y="110" fill="#94a3b8" font-family="sans-serif" font-size="12">3. Electrical & Chiller Hookup</text>
      <rect x="410" y="96" width="110" height="20" rx="4" fill="#38bdf8"/>

      <text x="0" y="155" fill="#94a3b8" font-family="sans-serif" font-size="12">4. Hot Trial Commissioning</text>
      <rect x="500" y="141" width="100" height="20" rx="4" fill="#f59e0b"/>
    </g>
  </g>

  <text x="40" y="380" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">PROJECT CONTROL CENTER</text>
  <text x="40" y="405" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">INDUSTRIAL PROJECT & TRIAL ORCHESTRATION</text>
