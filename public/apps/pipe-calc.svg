<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="50%" stop-color="#0a3247"/>
      <stop offset="100%" stop-color="#05141e"/>
    </linearGradient>
    <linearGradient id="pipeWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#pbg)"/>
  <circle cx="400" cy="225" r="150" fill="#0284c7" opacity="0.1" filter="blur(50px)"/>

  <!-- Pipe Blueprint Circle -->
  <circle cx="400" cy="210" r="130" fill="none" stroke="#38bdf8" stroke-width="28" opacity="0.85"/>
  <circle cx="400" cy="210" r="144" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="400" cy="210" r="116" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Center Crosshairs -->
  <line x1="220" y1="210" x2="580" y2="210" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="400" y1="30" x2="400" y2="390" stroke="#64748b" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Dimension Markers -->
  <line x1="400" y1="210" x2="530" y2="100" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="530" cy="100" r="4" fill="#38bdf8"/>
  <line x1="400" y1="210" x2="500" y2="125" stroke="#f59e0b" stroke-width="2"/>
  <circle cx="500" cy="125" r="4" fill="#f59e0b"/>

  <!-- Badges -->
  <g transform="translate(60, 60)">
    <rect width="200" height="85" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">STANDARD RATIO</text>
    <text x="16" y="58" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="900">SDR 17.0</text>
  </g>

  <g transform="translate(540, 60)">
    <rect width="200" height="85" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="16" y="28" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="bold">WALL THICKNESS</text>
    <text x="16" y="58" fill="#f59e0b" font-family="sans-serif" font-size="28" font-weight="900">6.6 mm</text>
  </g>

  <g transform="translate(300, 340)">
    <rect width="200" height="60" rx="8" fill="#0f172a" fill-opacity="0.88" stroke="#10b981" stroke-width="1.5"/>
    <text x="16" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" font-weight="bold">WEIGHT PER METER</text>
    <text x="16" y="46" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="900">3.48 kg / m</text>
  </g>

  <text x="40" y="415" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="800">PVC PIPE CALCULATIONS</text>
  <text x="40" y="432" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600">PIPE ENGINEERING & DIMENSIONS</text>
</svg>